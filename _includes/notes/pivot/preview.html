{%- comment -%}
  First rows of the table, some columns, with types as coloured badges.
  Data: _data/pokemon_pivot.yml (generated by scripts/notes/pivot_data.py).
{%- endcomment -%}
{%- assign es = false %}{% if page.lang == 'es-ES' %}{% assign es = true %}{% endif -%}
<figure class="pt-window" data-pt="preview">
  <div class="pt-window__bar" aria-hidden="true"><span></span><span></span><span></span><span class="pt-window__title">dwh_dbt.pokemon_stats</span></div>
  <div class="pt-scroll" tabindex="0" role="region" aria-label="{% if es %}Primeras filas de la tabla{% else %}First rows of the table{% endif %}">
    <table class="pt-grid">
      <thead><tr><th scope="col">Name</th><th scope="col">Type1</th><th scope="col">Type2</th><th scope="col">Total</th><th scope="col">HP</th><th scope="col">Attack</th><th scope="col">Defense</th><th scope="col">Speed</th></tr></thead>
      <tbody>
        {%- for p in site.data.pokemon_pivot.preview %}
        <tr style="--i: {{ forloop.index0 }}">
          <th scope="row">{{ p.name }}</th>
          <td><span class="pt-badge" style="--type: var(--t-{{ p.type1 | downcase }})">{{ p.type1 }}</span></td>
          <td>{% if p.type2 != "" %}<span class="pt-badge" style="--type: var(--t-{{ p.type2 | downcase }})">{{ p.type2 }}</span>{% else %}<span class="pt-null">NULL</span>{% endif %}</td>
          <td>{{ p.total }}</td><td>{{ p.hp }}</td><td>{{ p.attack }}</td><td>{{ p.defense }}</td><td>{{ p.speed }}</td>
        </tr>
        {%- endfor %}
      </tbody>
    </table>
  </div>
  <figcaption>{% if es %}Tabla de Pokémon con sus estadísticas: las 8 primeras de {{ site.data.pokemon_pivot.rows }} filas y algunas de sus columnas.{% else %}The Pokémon table with their stats: the first 8 of {{ site.data.pokemon_pivot.rows }} rows and some of the columns.{% endif %}</figcaption>
</figure>
