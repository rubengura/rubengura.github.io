{%- comment -%}
  First-turn questions with their probabilities and variance, highest first.
  Data: _data/guess_who.yml (generated by scripts/notes/guess_who_data.py).
{%- endcomment -%}
{%- assign es = false %}{% if page.lang == 'es-ES' %}{% assign es = true %}{% endif -%}
<figure class="gw-table" data-gw="table">
  <table>
    <thead>
      <tr>
        <th scope="col">{% if es %}Pregunta{% else %}Question{% endif %}</th>
        <th scope="col">{% if es %}Sí{% else %}Yes{% endif %}</th>
        <th scope="col">No</th>
        <th scope="col">{% if es %}Varianza{% else %}Variance{% endif %}</th>
      </tr>
    </thead>
    <tbody>
      {%- for q in site.data.guess_who.questions %}
      <tr{% if forloop.first %} class="is-best"{% endif %} style="--var: {{ q.var }}; --i: {{ forloop.index0 }}">
        <th scope="row">{% if es %}{{ q.es }}{% else %}{{ q.en }}{% endif %}{% if forloop.first %} <span class="gw-best">★ {% if es %}la mejor{% else %}the best{% endif %}</span>{% endif %}</th>
        <td>{{ q.n_yes }}/20 <span class="gw-muted">({{ q.p_yes }})</span></td>
        <td>{{ 20 | minus: q.n_yes }}/20 <span class="gw-muted">({{ q.p_no }})</span></td>
        <td><span class="gw-var"><span class="gw-var__bar" aria-hidden="true"></span>{{ q.var_text }}</span></td>
      </tr>
      {%- endfor %}
    </tbody>
  </table>
  <figcaption>{% if es %}Lista de algunas preguntas con sus probabilidades y varianza asociadas, en el primer turno.{% else %}Some questions with their probabilities and variance, on the first turn.{% endif %}</figcaption>
</figure>
