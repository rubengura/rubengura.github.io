{%- assign t = site.data.i18n[page.lang] -%}
<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__name">{{ site.author.name }}</p>
    <ul class="site-footer__links">
      {%- for link in site.social.links %}
      <li>{% include profile-link.html url=link %}</li>
      {%- endfor %}
      <li><a href="{{ t.urls.feed | relative_url }}">{{ t.footer.feed }}</a></li>
    </ul>
    <p class="site-footer__colophon">
      {{ t.footer.colophon }}
      <a href="{{ site.repository_url }}">{{ t.footer.source }}</a>.
    </p>
  </div>
</footer>
