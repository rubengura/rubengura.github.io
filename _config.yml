# -----------------------------------------------------------------------------
# Site configuration
#
# GitHub Pages builds this site with Jekyll on every push to `master`.
# Changes to this file need a restart of `bundle exec jekyll serve` locally.
# -----------------------------------------------------------------------------

# Identity --------------------------------------------------------------------
title: Rubén Guerrero          # site name: browser tab, search results, link previews
handle: rubengura              # wordmark in the header
tagline: Ingeniero de datos    # home page <title>: "Rubén Guerrero | Ingeniero de datos"
description: >-
  Rubén Guerrero es ingeniero de datos y estudió psicología. Proyectos de
  ingeniería contados con sus decisiones, y notas sobre datos, psicología,
  IA y futuros posibles.
# The home page headline and all other interface text, in both languages,
# are in _data/i18n.yml.

author:
  name: Rubén Guerrero
  url: https://rubengura.github.io/

# Profiles shown in the footer and the About page, and declared to search
# engines (jekyll-seo-tag). Add your LinkedIn URL here when you have it.
social:
  name: Rubén Guerrero
  links:
    - https://github.com/rubengura
    # - https://www.linkedin.com/in/your-profile/

repository_url: https://github.com/rubengura/rubengura.github.io

# URLs ------------------------------------------------------------------------
url: https://rubengura.github.io
baseurl: ""
lang: es-ES                    # default language; English pages live under /en/
timezone: Europe/Madrid
# Navigation is in _data/i18n.yml, one list per language.

# Content ---------------------------------------------------------------------
# The site is Spanish first. Notes live in _posts/ and are published at
# /notas/<file-name-without-date>/; English notes live in en/_posts/ and are
# published at /en/notes/<...>/
permalink: /notas/:title/

# Engineering Lab projects live in _projects/ and are published at /lab/<file-name>/
# English projects live in _projects/en/ and are published at /en/lab/<file-name>/
collections:
  projects:
    output: true
    permalink: /lab/:name/

# Every page has a `lang` (en-GB or es-ES). A translation shares the same `ref`
# as the original, which is how the language switch finds it.
defaults:
  # From general to specific: Jekyll lets a later, more specific scope win
  # only if it comes after the general ones.
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og-default.png
      lang: es-ES
  - scope:
      path: ""
      type: posts
    values:
      layout: note
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "en"
    values:
      lang: en-GB
  - scope:
      path: "en"
      type: posts
    values:
      permalink: /en/notes/:title/
  - scope:
      path: "_projects/en"
      type: projects
    values:
      lang: en-GB
      permalink: /en/lab/:name/

# Build -----------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  footnote_backlink: "&#8617;&#xfe0e;"   # text-style return arrow (no emoji on iOS)
highlighter: rouge

# Only plugins supported by GitHub Pages (https://pages.github.com/versions/).
# The feeds are plain templates (feed.xml, en/feed.xml) rather than jekyll-feed,
# which can't keep one feed per language. jekyll-redirect-from keeps the
# addresses from before the move to Spanish-first working (redirect_from in
# front matter; the page is _layouts/redirect.html).
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Files that are part of the repository but not of the website.
exclude:
  - README.md
  - docs/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - node_modules/
